[project]
name = "sqlite-utils-sqlalchemy"
version = "0.1.0"
description = "A research spike for a sqlite-utils-style API backed by SQLAlchemy"
readme = "README.md"
authors = [
    { name = "Simon Willison", email = "swillison@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "duckdb-engine>=0.17,<1",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "testing-postgresql>=1.3,<2",
]
