[project]
name = "alchemy-utils"
version = "0.1.0"
description = "A research spike for a sqlite-utils-style API backed by SQLAlchemy"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Simon Willison"}]
requires-python = ">=3.10"
dependencies = [
    "click>=8.1,<9",
    "sqlalchemy>=2.0,<3",
    "typing-extensions>=4.12",
]

[project.scripts]
alchemy-utils = "alchemy_utils.cli:cli"

[project.optional-dependencies]
duckdb = [
    "duckdb>=1.5,<1.6",
    "duckdb-engine==0.17.0",
]
postgresql = [
    "psycopg[binary]>=3.2,<4",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "duckdb>=1.5,<1.6",
    "duckdb-engine==0.17.0",
    "psycopg[binary]>=3.2,<4",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
    "testing-postgresql>=1.3,<2",
]
